# Tags a new release from the conventional-commit subjects since the last one,
# then releases it. It runs on a schedule so that commits do not sit
# unreleased (overhead-tag.yaml releases at most once per two weeks that way),
# and can be dispatched from the GitHub UI, say after a fix users wait for.
name: Tag a Release
on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *" # Daily at 3PM UTC
jobs:
  tag:
    uses: ./.github/workflows/overhead-tag.yaml
    permissions:
      contents: write # allow create tag
      actions: read # the tag job checks CI passed on the commit
  release:
    needs: tag
    uses: ./.github/workflows/release.yaml
    with:
      tag_name: ${{ needs.tag.outputs.new-tag-version }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
    if: needs.tag.outputs.new-tag == 'true' && needs.tag.outputs.new-tag-version-type != 'major'
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
