name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run to catch upstream breakage (new Dart SDK, Bazel, deps)
  schedule:
    - cron: "0 9 * * 1"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
env:
  # Part of every setup-bazel cache key below. A cache restored on an exact key
  # hit is never saved again, so it freezes at whatever the first run put in
  # it; bump this number to start the caches afresh. The Commit messages
  # workflow (commit-messages.yaml) passes its own: bump that one too.
  CACHE_VERSION: "1"
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  # Every job below that runs its own steps has a timeout, one value per kind of
  # job, at about three times its slowest recent run: 15 minutes for checks
  # that run one or two commands, 30 for a Bazel build or test of one
  # workspace, 60 for the whole-program run of the root workspace. A caller of
  # a reusable workflow (`test`) cannot set one.
  test:
    uses: bazel-contrib/.github/.github/workflows/bazel.yaml@1d798ff015ed0696433e01e2c3ccbb2abefadad7 # v7.7.0
    with:
      bazel_versions: '["9.3.0"]'
      # Exit code 4 means "build succeeded but no test targets found", which is
      # expected for build-only e2e folders like web_app and pub_deps.
      # Wrapped in bash -c because the reusable workflow uses the runner's
      # default shell (PowerShell on Windows) where [ $? -eq 4 ] is invalid.
      # Inner single quotes prevent the outer shell from expanding $?.
      bazel_test_command: "bash -c 'bazel test --test_output=errors //... || [ $? -eq 4 ]'"
      folders: |
        [
          ".",
          "e2e/smoke",
          "e2e/hello_world",
          "e2e/library_deps",
          "e2e/analysis",
          "e2e/dart_test",
          "e2e/dart_test_pkg",
          "e2e/codegen",
          "e2e/pub_deps",
          "e2e/pub_lock",
          "e2e/web_app",
          "e2e/web_compiler",
          "e2e/gazelle",
          "e2e/cross_compile",
          "e2e/pub_lock_cross_module",
          "e2e/pub_lock_dedup",
          "e2e/pub_lock_upgrade",
          "e2e/pub_hub_surface",
          "e2e/pub_lock_cycle",
          "e2e/pub_lock_git",
          "e2e/pub_lock_resolve",
          "e2e/pub_member_kind",
          "e2e/pub_override_root_lock",
          "e2e/pub_package_padded",
          "e2e/ext_exemplar",
          "e2e/dual_build",
          "e2e/fix",
          "e2e/analyze_composition",
          "e2e/link_hook",
          "e2e/external_module",
          "overhead",
          "tools"
        ]
  # `dart format` and `dart analyze` find their configuration by walking up from
  # the file they are given, and that walk does not stop at the project root. It
  # used to escape: under a sandbox it found nothing (so a repo's configured
  # page width was silently ignored), and unsandboxed it climbed into the
  # execroot — or, in manifest runfiles mode, ran against the source tree
  # outright. Which of those happened decided the verdict, so the same code
  # passed or failed depending on the flags.
  #
  # The `dart_analyze` aspect's staged project bounds the walk, and
  # `e2e/analysis_failure`'s root analysis_options.yaml — deliberately left out
  # of its `analysis_config` — carries an absurd `page_width: 20` canary so this
  # job can prove it: `//:clean_lib` there is formatted at the stock 80, so if
  # the walk ever escapes it reaches the canary and turns red. `e2e/analysis`
  # runs its whole suite beside it, so its configured widths, `package:`
  # includes and language versions must agree across all four cells too.
  format-hermeticity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: forest runfiles, sandboxed
            flags: ""
          - name: forest runfiles, local
            flags: "--spawn_strategy=standalone"
          - name: manifest runfiles, sandboxed
            flags: "--noenable_runfiles"
          - name: manifest runfiles, local
            flags: "--noenable_runfiles --spawn_strategy=standalone"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: analysis — ${{ matrix.name }}
        working-directory: e2e/analysis
        # Exit code 4: the workspace has no test targets, only the aspect's
        # checks, which `bazel test` builds.
        run: bazel test ${{ matrix.flags }} --test_output=errors //... || [ $? -eq 4 ]
      # The format check must take only what `dart format` reads, so editing a
      # dependency cannot re-run it above. Read from the action graph, which a
      # test cannot see.
      - name: analysis — format check inputs, ${{ matrix.name }}
        working-directory: e2e/analysis
        run: bazel run ${{ matrix.flags }} //format_inputs
      - name: analysis_failure canary — ${{ matrix.name }}
        working-directory: e2e/analysis_failure
        run: bazel test ${{ matrix.flags }} //:clean_lib || [ $? -eq 4 ]
  # The build-wide escape hatch: every dart_test compiled whole-program. Run
  # over the workspaces whose tests cover codegen, generated parts and the
  # package:test runner, so the path the flag falls back to cannot rot.
  whole-program:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        folder: [".", "e2e/dart_test", "e2e/codegen"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: dart_test whole-program — ${{ matrix.folder }}
        working-directory: ${{ matrix.folder }}
        run: bazel test --test_output=errors --@rules_dart//dart:modular_kernel=false //...
  # The runner snapshot cache off, the default this repository's .bazelrc
  # overrides: `test_runner_test` checks that the runner then starts from its
  # kernel and no cache is touched.
  runner-snapshot-off:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: dart_test without the runner snapshot cache
        run: bazel test --test_output=errors --@rules_dart//dart:runner_snapshot=false //dart/private/tools:test_runner_test
  # Workspaces that are expected to fail at module resolution.
  # Validates that rules_dart produces the correct error messages.
  expected-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pub_lock_conflict — expect version conflict error
        working-directory: e2e/pub_lock_conflict
        run: |
          if bazel build //:app 2>/dev/null; then
            echo "ERROR: build should have failed with a version conflict"
            exit 1
          fi
          bazel build //:app 2>&1 | grep -q "conflicting versions across lock files"
          echo "OK: expected conflict error detected"
      - name: pub_package_conflict — expect two modules' declarations to fail, naming both
        working-directory: e2e/pub_package_conflict
        run: |
          if out=$(bazel build @pub//:path 2>&1); then
            echo "ERROR: build should have failed: mod_b and mod_c declare different versions of path"
            exit 1
          fi
          echo "$out" | grep -q "declared at different versions by modules the root depends on"
          echo "$out" | grep -q "from module \`mod_b\`"
          echo "$out" | grep -q "from module \`mod_c\`"
          echo "OK: expected declaration conflict detected"
      - name: toolchain_pin_conflict — expect a root pin below a dependency's request to fail, naming it
        working-directory: e2e/toolchain_pin_conflict
        run: |
          if out=$(bazel build @dart_toolchains//:all 2>&1); then
            echo "ERROR: build should have failed: newer_dep requests a newer Dart SDK than the root pins"
            exit 1
          fi
          echo "$out" | grep -q "newer_dep requests 99.0.0"
          echo "$out" | grep -q "allow_upgrade_by_dependencies = True"
          echo "OK: expected toolchain upgrade refusal detected"
      - name: pub_lock_unsupplied — expect a dependency on an unsupplied sdk package to fail
        working-directory: e2e/pub_lock_unsupplied
        run: |
          if out=$(bazel build //... 2>&1); then
            echo "ERROR: build should have failed: xml depends on the sdk package petitparser"
            exit 1
          fi
          echo "$out" | grep -q "nothing supplies \`petitparser\`"
          echo "OK: expected unsupplied dependency detected"
      - name: pub_lock_resolve_invalid — expect unmapped path packages and a stale mapping to fail, naming each
        working-directory: e2e/pub_lock_resolve_invalid
        run: |
          if out=$(bazel build @pub//:path 2>&1); then
            echo "ERROR: build should have failed: path packages unmapped, and http mapped but not locked"
            exit 1
          fi
          echo "$out" | grep -q "it lists \`models\`, \`utils\` as \`path\` packages"
          echo "$out" | grep -q "\`resolve\` maps \`http\`, which the lock does not list"
          echo "OK: expected resolve errors detected"
      # Every pub archive is checked against a pinned digest: a lock entry or a
      # `pub.package()` without one, or two locks disagreeing on one, fails.
      - name: pub_lock_unpinned — expect a lock entry without sha256 to be refused
        working-directory: e2e/pub_lock_unpinned
        run: |
          if bazel build @deps//:path 2>/dev/null; then
            echo "ERROR: build should have refused path's missing sha256"
            exit 1
          fi
          bazel build @deps//:path 2>&1 | grep -q "No sha256 is pinned for pub package \"path\""
          echo "OK: unpinned lock entry refused"
      - name: pub_lock_git_unpinned — expect a git entry without a full commit id to be refused
        working-directory: e2e/pub_lock_git_unpinned
        run: |
          if bazel build @deps//:foo 2>/dev/null; then
            echo "ERROR: build should have refused foo's abbreviated resolved-ref"
            exit 1
          fi
          bazel build @deps//:foo 2>&1 | grep -q 'resolved-ref "a1b2c3d", which is not a full commit id'
          echo "OK: unpinned git entry refused"
      - name: pub_lock_git_conflict — expect the locks' disagreement to be refused
        working-directory: e2e/pub_lock_git_conflict
        run: |
          if bazel build @one//:foo 2>/dev/null; then
            echo "ERROR: build should have refused the locks' disagreement"
            exit 1
          fi
          bazel build @one//:foo 2>&1 | grep -q 'is locked differently across lock files'
          echo "OK: disagreement refused"
      - name: pub_lock_git_hosted — expect the locks' disagreement to be refused
        working-directory: e2e/pub_lock_git_hosted
        run: |
          if bazel build @one//:foo 2>/dev/null; then
            echo "ERROR: build should have refused the locks' disagreement"
            exit 1
          fi
          bazel build @one//:foo 2>&1 | grep -q 'is a git package in'
          echo "OK: disagreement refused"
      - name: pub_package_blank_sha — expect pub.package(sha256 = "") to be refused
        working-directory: e2e/pub_package_blank_sha
        run: |
          if bazel build @path//:path 2>/dev/null; then
            echo "ERROR: build should have refused path's blank sha256"
            exit 1
          fi
          bazel build @path//:path 2>&1 | grep -q "No sha256 is pinned for pub package \"path\""
          echo "OK: blank pub.package sha256 refused"
      - name: pub_lock_digest_conflict — expect locks disagreeing on a digest to be refused
        working-directory: e2e/pub_lock_digest_conflict
        run: |
          if bazel build @deps_a//:path 2>/dev/null; then
            echo "ERROR: build should have refused the conflicting sha256 digests"
            exit 1
          fi
          bazel build @deps_a//:path 2>&1 | grep -q "conflicting sha256 digests across lock files"
          echo "OK: digest conflict refused"
      # A link hook that refuses the program's recorded uses fails the build,
      # and its own message reaches the user.
      - name: link_hook — expect a hook's refusal to fail the build, with its message
        working-directory: e2e/link_hook
        run: |
          if bazel build //:dynamic_app_assets 2>/dev/null; then
            echo "ERROR: build should have failed in glyphs' link hook"
            exit 1
          fi
          bazel build //:dynamic_app_assets 2>&1 | grep -q "a Glyph is constructed at run time"
          echo "OK: link hook failure reported"
      # A link hook runs against its package as Bazel declared it: a file of
      # the package that no target lists is not there to import, even when the
      # action runs where it is on disk.
      - name: link_hook — expect a hook to find only its package's declared files
        working-directory: e2e/link_hook
        run: |
          if bazel build //:undeclared_assets 2>/dev/null; then
            echo "ERROR: build should have failed: the hook imports an undeclared file"
            exit 1
          fi
          bazel build //:undeclared_assets 2>&1 | grep -q "package:undeclared_hook/extra.dart"
          echo "OK: undeclared file not found by the hook"
      # A VM program reaching web-only code, which `//...` skips, is refused
      # by name, with the chain to the incompatible library.
      - name: web_compiler — expect a VM program reaching web-only code to be refused
        working-directory: e2e/web_compiler
        run: |
          if bazel build //web_only:vm_reaching_web_only 2>/dev/null; then
            echo "ERROR: build should have failed: //web_only:web_only is incompatible with the host"
            exit 1
          fi
          bazel build //web_only:vm_reaching_web_only 2>&1 | grep -q "//web_only:web_only .*didn't satisfy constraint @@platforms//:incompatible"
          echo "OK: incompatible web-only code reported"
      # A library importing a package only its dependency's dependency
      # provides fails every executable that reaches it, through the import
      # check's validation action, with no per-library compile involved.
      - name: analysis_failure — expect the layering check to fail a binary's build
        working-directory: e2e/analysis_failure
        run: |
          if bazel build //import_check/user:layering_bin 2>/dev/null; then
            echo "ERROR: build should have failed the layering check"
            exit 1
          fi
          bazel build //import_check/user:layering_bin 2>&1 | grep -q 'package "import_check_leaf" is not a direct dependency'
          echo "OK: layering violation reported"
      # Every import, export and part must be a `dart:` library, a `package:`
      # URI a dependency provides, or a file the target holds. Each target
      # below names a file another way, and the import check refuses it with
      # the spelling to use; the last is a library nothing executable reaches,
      # which checks itself.
      - name: analysis_failure — expect the import check to refuse undeclared spellings
        working-directory: e2e/analysis_failure
        run: |
          check() {
            if bazel build "$1" 2>/dev/null; then
              echo "ERROR: $1 should have failed the import check"
              exit 1
            fi
            bazel build "$1" 2>&1 | grep -qF -- "$2"
          }
          check //import_check/spellings:relative_lib_test "Use 'package:import_check_spellings/x.dart' instead"
          check //import_check/spellings:file_uri_bin "imports 'file:///tmp/undeclared.dart', a file: URI"
          check //import_check/spellings:unheld_part "has the part 'unheld_part.g.dart'"
          echo "OK: undeclared spellings refused"
      # Each target in e2e/analysis_failure is expected red under the
      # `dart_analyze` aspect, which its `.bazelrc` applies under `bazel test`.
      # `check` builds one, expects the build to fail, and greps its output
      # for the one diagnostic only that target produces.
      - name: analysis_failure — expect analyzer diagnostics to fail the build, at workspace paths
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //:bad_lib 2>/dev/null; then
            echo "ERROR: build should have failed with analyzer diagnostics"
            exit 1
          fi
          out=$(bazel test //:bad_lib 2>&1 || true)
          echo "$out" | grep -q "unused_local_variable"
          # Named as the user's file, not as the staged copy under `src/`.
          echo "$out" | grep -q -- "- lib/bad.dart:4:7 -"
          echo "OK: expected analyzer failure detected, at the workspace path"
      - name: analysis_failure — expect a diagnostic's related location at its workspace path
        working-directory: e2e/analysis_failure
        run: |
          out=$(bazel test //context 2>&1 || true)
          echo "$out" | grep -q "referenced_before_declaration"
          echo "$out" | grep -q -- " - The declaration of 'x' is here at context/lib/context.dart:3:7"
          echo "OK: related location named at the workspace path"
      - name: analysis_failure — expect a binary's entrypoint to be analyzed too
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //:bad_bin 2>/dev/null; then
            echo "ERROR: build should have failed with analyzer diagnostics"
            exit 1
          fi
          bazel test //:bad_bin 2>&1 | grep -q "unused_import"
          echo "OK: expected analyzer failure detected"
      # A `flutter_library` lists its files in `DefaultInfo` and leaves
      # `DartAnalyzableInfo.srcs` empty; they are its own files all the same.
      - name: analysis_failure — expect a flutter_library-shaped target to be analyzed
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //flutter_shaped 2>/dev/null; then
            echo "ERROR: build should have failed with unused_element"
            exit 1
          fi
          bazel test //flutter_shaped 2>&1 | grep -q "unused_element"
          echo "OK: package-only target analyzed"
      - name: analysis_failure — expect a bundle-shaped target's package sources to be analyzed
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //bundle_shaped 2>/dev/null; then
            echo "ERROR: build should have failed with unused_element"
            exit 1
          fi
          bazel test //bundle_shaped 2>&1 | grep -q "bundle_shaped/lib/bundle.dart.*unused_element"
          echo "OK: package sources analyzed though DefaultInfo is a bundle"
      # Each file is judged by the nearest options file above it, as in the
      # IDE: `nested/lib/quiet.dart` breaks `nested/`'s `avoid_print`, and
      # `nested/lib/loud/loud.dart` prints under nearer options that allow it.
      - name: analysis_failure — expect the nearest options file to govern each file
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //nested 2>/dev/null; then
            echo "ERROR: build should have failed with avoid_print"
            exit 1
          fi
          out=$(bazel test //nested 2>&1 || true)
          echo "$out" | grep -q "nested/lib/quiet.dart:5:3 .* avoid_print"
          if echo "$out" | grep -q "loud.dart"; then
            echo "ERROR: loud.dart was judged by options other than its nearest"
            exit 1
          fi
          echo "OK: nearest options applied per file"
      # An `include:` that does not resolve makes the analyzer apply no rules at
      # all, so without a diagnostic a misconfigured ruleset and a clean
      # codebase look identical. These two steps pin both halves: a broken
      # include is reported, and a working one really does bring its lints to
      # bear. Both are SDK behaviour that nothing else here asserts.
      - name: analysis_failure — expect an unresolvable ruleset include to fail
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //unresolved_ruleset:clean_lib 2>/dev/null; then
            echo "ERROR: build should have failed with an unresolved include"
            exit 1
          fi
          bazel test //unresolved_ruleset:clean_lib 2>&1 | grep -q "include_file_not_found"
          echo "OK: expected unresolved include detected"
      - name: analysis_failure — expect an included ruleset's lints to be applied
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //vga:double_quoted_lib 2>/dev/null; then
            echo "ERROR: build should have failed with a very_good_analysis lint"
            exit 1
          fi
          bazel test //vga:double_quoted_lib 2>&1 | grep -q "prefer_single_quotes"
          echo "OK: included ruleset's lints reached the code"
      # The layout-gated half: `public_member_api_docs` only fires when the
      # nearest-pubspec walk roots the file's package at its true lib_root,
      # which the per-package stub pubspecs staged by `stage_dart_project`
      # provide. If they go missing this build silently turns green.
      - name: analysis_failure — expect package-root-gated lints to be applied
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //vga:undocumented_lib 2>/dev/null; then
            echo "ERROR: build should have failed with public_member_api_docs"
            exit 1
          fi
          bazel test //vga:undocumented_lib 2>&1 | grep -q "public_member_api_docs"
          echo "OK: package-root-gated lint reached the code"
      # A ruleset shared by another Bazel module is included from an options
      # file of this one; the module's own options file cannot govern here.
      - name: analyze_composition — expect another module's ruleset to apply
        working-directory: e2e/analyze_composition
        run: |
          if bazel test //bad 2>/dev/null; then
            echo "ERROR: build should have failed with avoid_print"
            exit 1
          fi
          bazel test //bad 2>&1 | grep -q "avoid_print"
          echo "OK: included ruleset from another module applied"
      - name: analyze_composition — expect another repository's options to be refused
        working-directory: e2e/analyze_composition
        run: |
          if bazel build //:cross_repo_config 2>/dev/null; then
            echo "ERROR: build should have refused an options file from another repository"
            exit 1
          fi
          bazel build //:cross_repo_config 2>&1 | grep -q "is in another repository"
          echo "OK: cross-repository options refused"
      # The format check's red paths, under the aspect's `dart_format` output
      # group. The first is the obvious one; the other two exist because
      # `dart format` treats an unresolvable `include:` as a warning, exits 0,
      # and silently formats at stock defaults — so a broken options file and a
      # correctly formatted codebase look identical unless the runner
      # escalates. These also pin the SDK's warning text, which that escalation
      # matches on. Each target is tagged `no-dart-analyze`, so the format check
      # is the only thing that can fail it.
      - name: analysis_failure — expect a formatting violation to fail
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //fmt 2>/dev/null; then
            echo "ERROR: build should have failed with a formatting violation"
            exit 1
          fi
          bazel test //fmt 2>&1 | grep -q "Changed fmt/lib/misformatted.dart"
          echo "OK: expected formatting failure detected, at the workspace path"
      - name: analysis_failure — expect an unresolvable format ruleset to fail
        working-directory: e2e/analysis_failure
        run: |
          if bazel test //fmt_unresolved 2>/dev/null; then
            echo "ERROR: build should have failed with an unresolved include"
            exit 1
          fi
          bazel test //fmt_unresolved 2>&1 | grep -q "Failed to resolve package URI"
          echo "OK: silently-degraded format options rejected"
      # A relative `include:` of a yaml no target declares. The file exists in
      # the workspace, so a check that read outside its staged project — as an
      # unsandboxed action could — would go green or fail differently. Both
      # checks must fail on the unreadable include, naming it at its workspace
      # path, under the sandbox and without one alike.
      - name: analysis_failure — expect an undeclared relative include to fail both checks
        working-directory: e2e/analysis_failure
        run: |
          for strategy in "" "--spawn_strategy=standalone"; do
            for group in dart_analyze dart_format; do
              flags=(${strategy:+"$strategy"} "--output_groups=-dart_analyze,-dart_format,+$group")
              if bazel test "${flags[@]}" //undeclared_include 2>/dev/null; then
                echo "ERROR: $group [$strategy] should have failed on the undeclared include"
                exit 1
              fi
              out=$(bazel test "${flags[@]}" //undeclared_include 2>&1 || true)
              case $group in
                dart_analyze) echo "$out" | grep -q "The URI 'shared.yaml' included in 'undeclared_include/analysis_options.yaml' can't be found" ;;
                dart_format) echo "$out" | grep -q "Couldn't read file \"undeclared_include/shared.yaml\"" ;;
              esac
            done
          done
          echo "OK: undeclared include refused by both checks, under every strategy"
      # The format check runs only when its output group is asked for: with
      # `dart_format` removed from the groups `.bazelrc` requests, the
      # misformatted target builds green.
      - name: analysis_failure — expect the format check to run only when requested
        working-directory: e2e/analysis_failure
        run: |
          bazel test --output_groups=-dart_format //fmt || [ $? -eq 4 ]
          echo "OK: format check skipped when its output group is not requested"
      # A `manual` target is out of `//...`'s reach; `dart_analysis_test` names
      # it and must fail to build on its violation, whatever output groups the
      # command line asks for.
      - name: analysis_failure — expect dart_analysis_test to fail on a manual target's violation
        working-directory: e2e/analysis_failure
        run: |
          flags="--output_groups=-dart_analyze,-dart_format"
          if bazel test $flags //manual:manual_analysis_test 2>/dev/null; then
            echo "ERROR: build should have failed with dead_code"
            exit 1
          fi
          bazel test $flags //manual:manual_analysis_test 2>&1 | grep -q "manual/lib/manual_bad.dart:4:3 - Dead code"
          echo "OK: dart_analysis_test checked the manual target"
      # A hung test is diagnosed from what it printed before Bazel killed it, so
      # that output has to be in test.log rather than held back by the launcher.
      - name: dart_test — expect a timed-out test's output in its log
        working-directory: e2e/dart_test
        run: |
          if bazel test --test_timeout=5 //:hangs_until_killed_test; then
            echo "ERROR: test should have timed out"
            exit 1
          fi
          log=bazel-testlogs/hangs_until_killed_test/test.log
          grep -q "Test timed out" "$log"
          grep -q "printed before hanging" "$log"
          grep -q "written to stderr before hanging" "$log"
          echo "OK: timed-out test's output reached its log"
  # Hostile pub archives served from a file:// registry: nothing fetched may
  # refer or write outside its package, whichever host `tar` extracts it.
  pub-archive-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - name: pub_archive_links — expect no fetched archive to reach outside its package
        working-directory: e2e/pub_archive_links
        run: dart check.dart
      - name: pub_lock_git — expect host git config to reach only the fetch, by-id refusal included
        working-directory: e2e/pub_lock_git
        run: dart check_host_config.dart
  # `dart compile kernel` rejects `--enable-asserts`, so dbg-mode flags are
  # chosen per compile mode. hello_world builds all four dart_binary modes;
  # dart_test exercises the kernel test path end-to-end.
  dbg-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: hello_world — build all compile modes under -c dbg
        working-directory: e2e/hello_world
        run: bazel build -c dbg //...
      - name: dart_test — run tests under -c dbg
        working-directory: e2e/dart_test
        run: bazel test -c dbg --test_output=errors //...
  # The Gazelle plugin's tests live in the nested `dev/` module, which `//...`
  # in the root module does not reach.
  dev-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          disk-cache: ${{ github.job }}
          repository-cache: true
      - run: bazel test --test_output=errors @rules_dart_dev//...
  # A consuming module must be able to load every package of the published
  # module: tools and IDE plugins enumerate `@rules_dart//...`. Development
  # tooling loads repos a consumer never sees, so it lives in directories
  # REPO.bazel keeps out of the module's packages.
  consumer-query:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          repository-cache: true
      - name: Query the whole published module from a consumer
        working-directory: e2e/external_module
        run: bazel query "@rules_dart//..."
  # Every workspace's MODULE.bazel.lock is complete without anyone's
  # .bazelrc.user, the workspaces that fail on purpose included; so is every
  # pubspec.lock outside e2e/.
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          repository-cache: true
      - name: MODULE.bazel.lock files
        run: bazel run @overhead//locks
      - name: pubspec.lock files
        run: bazel run //tool:pub_locks
  # Every hook in .pre-commit-config.yaml, with the prek overhead pins, as a
  # commit runs them: one build puts overhead's tools in .bazel_env, then the
  # hooks run them without Bazel.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          repository-cache: true
      - run: bazel run --noincompatible_auto_exec_groups @overhead//:bazel_env -- update-symlink
      - run: bazel run --noincompatible_auto_exec_groups @overhead//lint:prek -- run --all-files --show-diff-on-failure
  # For branch protection settings, this job provides a "stable" name that can be used to gate PR merges
  # on "all matrix jobs were successful".
  conclusion:
    needs:
      - test
      - expected-failure
      - pub-archive-links
      - dbg-mode
      - dev-tests
      - consumer-query
      - lockfiles
      - pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
