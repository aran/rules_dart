# Reusable: opens the Bazel Central Registry pull request for a released tag,
# from the aran/bazel-central-registry fork. The pull request is a draft;
# marking it ready for review starts BCR's checks and auto-approval.
#
#   jobs:
#     publish:
#       uses: aran/rules_dart/.github/workflows/overhead-publish.yaml@<sha>
#       with:
#         tag_name: vX.Y.Z
#       secrets:
#         publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
#       permissions:
#         attestations: write
#         contents: write
#         id-token: write
name: Publish to BCR
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      publish_token:
        required: true
jobs:
  publish:
    # By tag, not commit: BCR checks the release's attestations with the SLSA
    # verifier, which accepts only a tag ref for the workflow that made them.
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.6.0
    with:
      tag_name: ${{ inputs.tag_name }}
      draft: true
      # GitHub repository which is a fork of the upstream where the Pull Request will be opened.
      registry_fork: aran/bazel-central-registry
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      # Necessary to push to the BCR fork, and to open a pull request against a registry
      publish_token: ${{ secrets.publish_token }}
