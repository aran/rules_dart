# Checks every commit pushed to main against the commit policy in AGENTS.md.
# We push straight to main, so there is no PR to check instead.
name: Commit messages
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/overhead-commit-messages.yaml
    with:
      # Bump to start the Bazel caches afresh (see CACHE_VERSION in ci.yaml).
      cache-version: "1"
