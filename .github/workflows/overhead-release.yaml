# Reusable: cuts a GitHub release of a tag with bazel-contrib's
# release_ruleset, which runs the caller's `.github/workflows/release_prep.sh
# <tag>` (a stub calling `bazel run @overhead//release:prep -- <tag>`) and
# uploads the source archive it writes. With `require_ci: true`, it first
# requires the CI workflow to have passed on the tagged commit: for a tag a
# schedule made, where no person judged the commit.
# The caller chains publishing:
#
#   jobs:
#     release:
#       uses: aran/rules_dart/.github/workflows/overhead-release.yaml@<sha>
#       with:
#         release_files: <module>-*.tar.gz
#         tag_name: ${{ inputs.tag_name || github.ref_name }}
#         # Only where a schedule tags (the caller's tag.yaml calls it):
#         require_ci: ${{ github.event_name != 'push' }}
#       permissions:
#         actions: read
#         contents: write
#         id-token: write
#         attestations: write
#     publish:
#       needs: release
#       uses: aran/rules_dart/.github/workflows/overhead-publish.yaml@<sha>
#       ...
name: Release
on:
  workflow_call:
    inputs:
      release_files:
        description: Newline-separated globs of the files release_prep.sh writes
        required: true
        type: string
      tag_name:
        required: true
        type: string
      ci_workflow:
        description: The CI workflow file that must have passed on the tagged commit
        type: string
        default: ci.yaml
      require_ci:
        description: Refuse to release unless ci_workflow passed on the tagged commit
        type: boolean
        default: false
permissions:
  actions: read
  id-token: write
  attestations: write
  contents: write
jobs:
  require-ci:
    if: inputs.require_ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # read the CI result for the commit
      contents: read
    steps:
      - name: Require CI to have passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci_workflow }}
          TAG: ${{ inputs.tag_name }}
        run: |
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          CONCLUSIONS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$CI_WORKFLOW" \
            --commit "$SHA" --status completed --json conclusion --jq '.[].conclusion')
          if ! grep -qx success <<<"$CONCLUSIONS"; then
            echo "::error::$CI_WORKFLOW has no successful run on $SHA ($TAG); not releasing."
            exit 1
          fi
  release:
    needs: require-ci
    # require-ci is skipped unless the caller passes require_ci: true.
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.require-ci.result) }}
    # By tag, not commit: BCR checks the release's attestations with the SLSA
    # verifier, which accepts only a tag ref for the workflow that made them.
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      release_files: ${{ inputs.release_files }}
      prerelease: false
      tag_name: ${{ inputs.tag_name }}
      # require-ci has already seen the CI workflow pass on this commit, so the
      # release only checks that the tagged tree resolves and analyses on a
      # clean runner, quietly: the reusable workflow's default runs every test
      # again, printing progress about once a second into the log.
      bazel_test_command: bazel build --nobuild --curses=no --noshow_progress //...
