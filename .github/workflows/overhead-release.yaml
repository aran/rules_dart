# Reusable: cuts a GitHub release of a tag with bazel-contrib's
# release_ruleset, which runs the caller's `.github/workflows/release_prep.sh
# <tag>` (a stub calling `bazel run @overhead//release:prep -- <tag>`) and
# uploads the source archive it writes. The caller chains publishing:
#
#   jobs:
#     release:
#       uses: aran/rules_dart/.github/workflows/overhead-release.yaml@<sha>
#       with:
#         release_files: <module>-*.tar.gz
#         tag_name: ${{ inputs.tag_name || github.ref_name }}
#       permissions:
#         contents: write
#         id-token: write
#         attestations: write
#     publish:
#       needs: release
#       uses: aran/rules_dart/.github/workflows/overhead-publish.yaml@<sha>
#       ...
name: Release
on:
  workflow_call:
    inputs:
      release_files:
        description: Newline-separated globs of the files release_prep.sh writes
        required: true
        type: string
      tag_name:
        required: true
        type: string
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  release:
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      release_files: ${{ inputs.release_files }}
      prerelease: false
      tag_name: ${{ inputs.tag_name }}
