# Reusable: checks every commit of a push against the commit policy in
# AGENTS.md (a conventional-commit subject, which the tag workflow derives the
# next version from, and the `Changelog:` trailer rules), and that the
# repository pins one revision of overhead throughout. Call it on push:
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     check:
#       uses: aran/rules_dart/.github/workflows/overhead-commit-messages.yaml@<sha>
#
# with <sha> the commit MODULE.bazel's git_override pins overhead at.
name: Commit messages
on:
  workflow_call:
    inputs:
      cache-version:
        description: >-
          Part of the Bazel cache keys. A cache restored on an exact key hit is never saved again, so it freezes; bump this to start it afresh.
        type: string
        default: "1"
permissions:
  contents: read
jobs:
  check:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ inputs.cache-version }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # A push that creates the branch, or a force push, has no "before" this
      # clone holds; the check then looks at the pushed commit alone.
      - name: Check the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bazel run @overhead//changelog:check -- --push "$BEFORE" "$AFTER"
      - name: Check that MODULE.bazel and the workflows pin one overhead
        run: bazel run @overhead//pins:check
