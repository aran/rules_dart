# Cut a release whenever a new tag is pushed to the repo.
name: Release
on:
  # Can be triggered from the tag.yaml workflow
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      publish_token:
        required: true
      # What a push of a tag reads from the repository's secrets, in place of
      # publish_token; declared so the expression below type-checks.
      BCR_PUBLISH_TOKEN:
        required: false
  # Or, developers can manually push a tag from their clone
  push:
    tags:
      - "v*.*.*"
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  release:
    uses: ./.github/workflows/overhead-release.yaml
    with:
      release_files: rules_dart-*.tar.gz
      tag_name: ${{ inputs.tag_name || github.ref_name }}
  publish:
    needs: release
    uses: ./.github/workflows/overhead-publish.yaml
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets:
      publish_token: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}
    permissions:
      attestations: write
      contents: write
      id-token: write
  pub-publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - name: Inject version from tag
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i "s/^version: 0\.0\.0-dev$/version: $VERSION/" dart/runfiles/pubspec.yaml
          echo "Publishing runfiles $VERSION"
      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          # The notes from release_prep.sh start at their `## X.Y.Z` heading,
          # after the bazel_dep snippet, which pub.dev users do not need.
          NOTES=$(gh release view "$TAG" --json body --jq .body | sed -n '/^## /,$p')
          printf '# Changelog\n\n%s\n' "$NOTES" > dart/runfiles/CHANGELOG.md
      - name: Publish to pub.dev
        run: dart pub publish --force
        working-directory: dart/runfiles
