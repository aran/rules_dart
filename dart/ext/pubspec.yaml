name: rules_dart_ext
publish_to: none
description: >
  Shared pubspec for the rules_dart code-gen extensions. Pins the shim-runner library deps (package:build, package:analyzer) and the per-builder generator packages (json_serializable, freezed, mockito, drift_dev, stacked_generator, …) so all shim binaries compile from one resolved version graph. Also pins package:hooks, package:data_assets and package:code_assets for the link hook runner, and package:coverage and package:vm_service for the collector `dart_test` runs under `bazel coverage`, and package:protobuf for the check that the public .bzl files are documented.

environment:
  sdk: ^3.12.0
dependencies:
  analyzer: ^14.5.0
  args: ^2.5.0
  bazel_worker: ^1.1.0
  build: ^4.0.0
  code_assets: ^2.2.0
  coverage: ^1.16.0
  crypto: ^3.0.0
  data_assets: ^0.20.0
  glob: ^2.1.0
  hooks: ^2.2.0
  logging: ^1.3.0
  package_config: ^3.0.0
  path: ^1.9.0
  protobuf: ^6.1.0
  pub_semver: ^2.2.0
  vm_service: ^15.4.0
  yaml: ^3.1.0
  built_value_generator: ^8.12.0
  copy_with_extension_gen: ^18.0.0
  drift_dev: ^2.32.0
  freezed: ^4.0.1
  json_serializable: ^6.13.0
  mockito: ^5.6.0
  stacked_generator: ^2.0.0
dev_dependencies:
  test: ^1.25.0
