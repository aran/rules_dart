# The lints every `dart_fix` and `dart_analyze_test` here is driven by.
#
# `prefer_final_locals` is the workhorse: a reliable, purely textual fix.
# `annotate_overrides` is the interesting one — the analyzer can only propose
# `@override` once it has resolved the supertype, so its fix appearing is proof
# that a `part` the fix rule excluded was still resolved.
linter:
  rules:
    - annotate_overrides
    - prefer_final_locals
