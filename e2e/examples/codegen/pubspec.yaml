name: codegen_e2e
environment:
  sdk: ^3.11.0
dev_dependencies:
  # No older than dart/ext's: this lock shares packages with rules_dart's
  # own, and a version older than rules_dart's fails the build.
  analyzer: ^14.5.0
  package_config: ^3.0.0
  test: ^1.33.0
  # The fixture generators' Builders and the shim runner they link
  # (`builder_shim_library` lists what it needs).
  args: ^2.5.0
  bazel_worker: ^1.1.0
  build: ^4.0.0
  crypto: ^3.0.0
  glob: ^2.1.0
  logging: ^1.3.0
  path: ^1.9.0
  pub_semver: ^2.2.0
  yaml: ^3.1.0
