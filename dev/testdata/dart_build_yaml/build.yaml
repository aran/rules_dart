targets:
  $default:
    builders:
      json_serializable:
        generate_for:
          - lib/user.dart
        options:
          field_rename: pascal
          explicit_to_json: true
      # The older separator.
      copy_with_extension_gen|copy_with_extension_gen:
        options:
          copy_with_null: true
      drift_dev:
        options:
          store_date_time_values_as_text: true
      build_web_compilers:entrypoint:
        options:
          compiler: dart2wasm
      # A builder none of the sources needs.
      mockito:mockBuilder:
        options:
          foo: 1
